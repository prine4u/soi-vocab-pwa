<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <meta name="theme-color" content="#FFED00" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="소이의 단어 암기장" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>소이의 단어 암기장</title>
</head>
<body>
<div id="root">
  <div style="
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: #FAF9F5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    z-index: 9999;
  ">
    <div style="position: relative; margin-bottom: 20px;">
      <img src="/icon.svg" alt="Soi Vocab Logo" width="84" height="84" style="
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(255, 237, 0, 0.45), 0 4px 12px rgba(15, 23, 42, 0.08);
        animation: soi-splash-pulse 1.8s infinite ease-in-out;
      " />
    </div>
    <div style="
      font-size: 1.25rem;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    ">
      소이의 단어 암기장
    </div>
    <div style="
      font-size: 0.82rem;
      font-weight: 600;
      color: #64748B;
      margin-bottom: 24px;
    ">
      FSRS 망각곡선 복습 엔진 불러오는 중...
    </div>
    <div style="
      display: flex;
      gap: 6px;
      align-items: center;
    ">
      <span class="soi-splash-dot" style="animation-delay: 0s;"></span>
      <span class="soi-splash-dot" style="animation-delay: 0.2s;"></span>
      <span class="soi-splash-dot" style="animation-delay: 0.4s;"></span>
    </div>
    <style>
      @keyframes soi-splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      .soi-splash-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #EAB308;
        display: inline-block;
        animation: soi-splash-bounce 1.2s infinite ease-in-out both;
      }
      @keyframes soi-splash-bounce {
        0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </div>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
