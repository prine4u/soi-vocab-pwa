<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <meta name="theme-color" content="#FFED00" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="소이의 단어 암기장" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>소이의 단어 암기장</title>
</head>
<body>
<div id="root">
  <!-- PWA 콜드 스타트 시 흰 화면 방지를 위한 인라인 스플래시 UI (따뜻한 노란 톤 + 스피너) -->
  <div style="
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: #FAF9F5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    z-index: 9999;
  ">
    <div style="position: relative; margin-bottom: 18px;">
      <img src="/icon.svg" alt="Soi Vocab Logo" width="80" height="80" style="
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(255, 237, 0, 0.45), 0 4px 12px rgba(15, 23, 42, 0.08);
        display: block;
      " />
    </div>
    <div style="
      font-size: 1.25rem;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    ">
      소이의 단어 암기장
    </div>
    <div style="
      font-size: 0.82rem;
      font-weight: 600;
      color: #64748B;
      margin-bottom: 22px;
    ">
      FSRS 단어장을 준비하고 있어요...
    </div>
    <!-- 따뜻한 노란 톤의 깔끔한 원형 스피너 -->
    <div class="soi-warm-spinner" role="status" aria-label="단어장 불러오는 중"></div>
    <style>
      .soi-warm-spinner {
        width: 30px;
        height: 30px;
        border: 3.5px solid #FEF08A;
        border-top: 3.5px solid #EAB308;
        border-radius: 50%;
        animation: soi-spin 0.85s linear infinite;
      }
      @keyframes soi-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </div>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
